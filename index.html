<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>YBS Simulator 3D - Yangon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        .hud-panel {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .badge {
            background: rgba(0, 0, 0, 0.75); border: 2px solid #f39c12;
            padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold;
            backdrop-filter: blur(5px);
        }
        .line-badge { background: #c0392b; border-color: #e74c3c; }

        #route-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 100; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
        }
        .modal-card {
            background: #2c3e50; border: 2px solid #f1c40f; border-radius: 16px;
            padding: 16px; width: 92%; max-width: 420px; max-height: 85vh;
            overflow-y: auto; text-align: center;
        }
        .route-btn {
            width: 100%; padding: 10px; margin: 5px 0; background: #27ae60;
            border: none; border-radius: 8px; color: white; font-weight: bold;
            font-size: 13px; cursor: pointer; text-align: left; padding-left: 12px;
        }
        .route-btn:active { background: #2ecc71; }

        #alert-box {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            background: #c0392b; padding: 8px 16px; border-radius: 10px;
            font-weight: bold; font-size: 13px; display: none; z-index: 15;
            text-align: center; border: 1px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .controls-layer {
            position: absolute; bottom: 15px; left: 0; width: 100%; height: 130px;
            z-index: 20; display: flex; justify-content: space-between; padding: 0 20px;
            pointer-events: none;
        }
        .btn-group { display: flex; gap: 10px; pointer-events: auto; }
        .touch-btn {
            width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.6); display: flex; justify-content: center;
            align-items: center; font-size: 20px; color: white; font-weight: bold;
        }
        .touch-btn:active { background: rgba(241, 196, 15, 0.7); }
        .btn-gas { background: rgba(46, 204, 113, 0.5); width: 65px; height: 65px; }
        .btn-brake { background: rgba(231, 76, 60, 0.5); width: 65px; height: 65px; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud-panel">
        <div class="badge line-badge" id="hud-line">YBS 1</div>
        <div class="badge" id="hud-money">ဝင်ငွေ: 15,000 ကျပ်</div>
        <div class="badge" id="hud-speed">0 km/h</div>
    </div>

    <div id="alert-box">🚨 မီးနီဖြတ်လို့ သို့မဟုတ် မှတ်တိုင်ကျော်လို့ ရဲဖမ်းခံရပါပြီ! ဒဏ်ငွေ ၅,၀၀၀ ကျပ် ဖြတ်သည်။</div>

    <div id="route-modal">
        <div class="modal-card">
            <h2>🚌 YBS ယာဉ်လိုင်း ရွေးချယ်ပါ</h2>
            <p style="margin: 6px 0 12px 0; font-size: 12px; color: #bdc3c7;">ရန်ကုန်မြို့ပြ ယာဉ်လိုင်း ၁ မှ ၂၇ အထိ</p>
            <div id="route-list-container"></div>
        </div>
    </div>

    <div class="controls-layer">
        <div class="btn-group">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="touch-btn btn-brake" id="btn-brake">STOP</div>
            <div class="touch-btn btn-gas" id="btn-gas">GAS</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); }

        const ybsData = [
            { id: 1, name: "YBS 1", route: "လှည်းကူးဈေး ⇄ ဌက" },
            { id: 2, name: "YBS 2", route: "ယုဇနဥယျာဉ်မြို့တော် ⇄ အောင်မင်္ဂလာ" },
            { id: 3, name: "YBS 3", route: "ယုဇနဥယျာဉ်(တာမွှေ) ⇄ ဆူးလေ" },
            { id: 4, name: "YBS 4", route: "ရတနာနှင်းဆီအိမ်ရာ ⇄ ဆူးလေ" },
            { id: 5, name: "YBS 5", route: "ရိုးမရိပ်သာ ⇄ ညောင်တုန်း" },
            { id: 6, name: "YBS 6", route: "ဒဂုံဆိပ်ကမ်း ⇄ ဒဂုံရတနာအဝေးပြေး" },
            { id: 7, name: "YBS 7", route: "တောင်ဒဂုံ ⇄ ဆူးလေ" },
            { id: 8, name: "YBS 8", route: "ဒဂုံဆိပ်ကမ်း ⇄ လသာ" },
            { id: 9, name: "YBS 9", route: "တိုင်းရင်းသားပညာတက္កသိုလ် ⇄ မင်္ဂလာဈေး" },
            { id: 10, name: "YBS 10", route: "တိုင်းရင်းသားကျေးရွာ ⇄ ဒဂုံတက္កသိုလ်" },
            { id: 11, name: "YBS 11", route: "အောင်မင်္ဂလာ ⇄ လသာ" },
            { id: 12, name: "YBS 12", route: "မြောက်ဒဂုံ ⇄ ဆူးလေ" },
            { id: 13, name: "YBS 13", route: "အရှေ့ဒဂုံ ⇄ ဗိုလ်တထောင်ဘုရား" },
            { id: 14, name: "YBS 14", route: "ပါရမီ ⇄ သသင်မြုန်းပန်းခြံ" },
            { id: 15, name: "YBS 15", route: "ဒဂုံတက္កသိုလ် ⇄ သုဝဏ္ဏ" },
            { id: 16, name: "YBS 16", route: "ရွှေပေါက်ကံ ⇄ ဒဂုံရတနာ" },
            { id: 17, name: "YBS 17", route: "ရွှေပေါက်ကံ(ဆေးရုံ) ⇄ ဒဂုံရတနာ" },
            { id: 18, name: "YBS 18", route: "ထောက်ကြန့် ⇄ တောင်ဒဂုံ(ယဉ်ကျေးမှု)" },
            { id: 19, name: "YBS 19", route: "ရွှေပေါက်ကံ ⇄ သသင်မြုန်း" },
            { id: 20, name: "YBS 20", route: "ဒဂုံရတနာ ⇄ သသင်မြုန်း" },
            { id: 21, name: "YBS 21", route: "အနောက်ပိုင်းတက္កသိုလ် ⇄ လသာ" },
            { id: 22, name: "YBS 22", route: "အနောက်ပိုင်းတက္កသိုလ် ⇄ သသင်မြုန်း" },
            { id: 23, name: "YBS 23", route: "သသင်မြုန်းပန်းခြံ (ပုသိမ်လမ်း)" },
            { id: 24, name: "YBS 24", route: "ဒဂုံတက္កသိုလ် ⇄ ဗိုလ်တထောင်" },
            { id: 25, name: "YBS 25", route: "ဒဂုံတက္កသိုလ် ⇄ ဘိုးကလေးဈေး" },
            { id: 26, name: "YBS 26", route: "ဒဂုံတက္កသိုလ် ⇄ ဗိုလ်တထောင်" },
            { id: 27, name: "YBS 27", route: "သုခဝတီအိမ်ရာ ⇄ မင်္ဂလာဈေး" }
        ];

        const listContainer = document.getElementById('route-list-container');
        ybsData.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'route-btn';
            btn.innerHTML = `<b>${item.name}</b> - ${item.route}`;
            btn.onclick = () => selectRoute(item.name);
            listContainer.appendChild(btn);
        });

        let scene, camera, renderer, bus;
        let speed = 0, maxSpeed = 0.52, accel = 0.01, brake = 0.035, friction = 0.005;
        let steerAngle = 0, maxSteer = 0.1;
        let money = 15000, currentLine = "YBS 1";
        let keys = { left: false, right: false, gas: false, brake: false };
        let busStops = [], rivalBuses = [];

        function initGame() {
            document.getElementById('route-modal').style.display = 'none';
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xa0c4ff);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            const roadMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(16, 3000),
                new THREE.MeshLambertMaterial({ color: 0x333333 })
            );
            roadMesh.rotation.x = -Math.PI / 2;
            roadMesh.position.z = 1500;
            scene.add(roadMesh);

            bus = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(2.2, 2.2, 5.5),
                new THREE.MeshLambertMaterial({ color: 0xf39c12 })
            );
            body.position.y = 1.3;
            bus.add(body);
            scene.add(bus);

            for (let z = 150; z < 2800; z += 220) {
                const stop = new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 3, 1), 
                    new THREE.MeshLambertMaterial({ color: 0x2980b9 })
                );
                stop.position.set(7.5, 1.5, z);
                scene.add(stop);
                busStops.push({ mesh: stop, z: z, collected: false });
            }

            for (let i = 0; i < 6; i++) {
                const rBus = new THREE.Mesh(
                    new THREE.BoxGeometry(2.2, 2.2, 5.5), 
                    new THREE.MeshLambertMaterial({ color: 0xe74c3c })
                );
                rBus.position.set((Math.random() - 0.5) * 8, 1.3, 60 + i * 130);
                scene.add(rBus);
                rivalBuses.push({ mesh: rBus, speed: 0.18 + Math.random() * 0.15 });
            }

            setupControls();
            animate();
        }

        function selectRoute(lineName) {
            currentLine = lineName;
            document.getElementById('hud-line').innerText = lineName;
            initGame();
        }

        function setupControls() {
            const bind = (id, k) => {
                const el = document.getElementById(id);
                el.ontouchstart = (e) => { e.preventDefault(); keys[k] = true; };
                el.ontouchend = (e) => { e.preventDefault(); keys[k] = false; };
            };
            bind('btn-left', 'left'); bind('btn-right', 'right');
            bind('btn-gas', 'gas'); bind('btn-brake', 'brake');
        }

        let alertTimer = 0;
        function triggerPoliceAlert() {
            money = Math.max(0, money - 5000);
            document.getElementById('hud-money').innerText = `ဝင်ငွေ: ${money} ကျပ်`;
            const alertBox = document.getElementById('alert-box');
            alertBox.style.display = 'block';
            clearTimeout(alertTimer);
            alertTimer = setTimeout(() => { alertBox.style.display = 'none'; }, 2500);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (keys.gas) speed = Math.min(speed + accel, maxSpeed);
            else if (keys.brake) speed = Math.max(speed - brake, 0);
            else speed = Math.max(speed - friction, 0);

            if (keys.left) steerAngle = Math.min(steerAngle + 0.012, maxSteer);
            else if (keys.right) steerAngle = Math.max(steerAngle - 0.012, -maxSteer);
            else steerAngle *= 0.8;

            bus.position.z += speed * 5;
            bus.position.x -= steerAngle * (speed + 0.1);
            bus.position.x = Math.max(Math.min(bus.position.x, 6), -6);

            camera.position.set(bus.position.x * 0.5, bus.position.y + 4, bus.position.z - 10);
            camera.lookAt(bus.position.x, bus.position.y + 1, bus.position.z + 5);

            rivalBuses.forEach(r => {
                r.mesh.position.z += r.speed * 3;
                if (r.mesh.position.z < bus.position.z - 25) {
                    r.mesh.position.z = bus.position.z + 300;
                }
            });

            busStops.forEach(stop => {
                let dist = stop.z - bus.position.z;
                if (dist < -10 && !stop.collected) {
                    triggerPoliceAlert();
                    stop.collected = true;
                }
                if (Math.abs(dist) < 5 && bus.position.x > 4 && speed < 0.04 && !stop.collected) {
                    money += 2000;
                    document.getElementById('hud-money').innerText = `ဝင်ငွေ: ${money} ကျပ်`;
                    stop.collected = true;
                }
            });

            document.getElementById('hud-speed').innerText = `${Math.round(speed * 110)} km/h`;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
